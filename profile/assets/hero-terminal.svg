<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" role="img" aria-label="Micro KI+ — Spezialisierte KI-Werkzeuge mit klarem Auftrag">
  <defs>
    <pattern id="scanlines" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect width="1200" height="2" fill="#000000" fill-opacity="0.22"/>
    </pattern>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.025"/>
    </pattern>
    <style>
      .mono { font-family: 'VT323', 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', 'Courier New', monospace; }
      .cursor { animation: blink 1.2s step-end infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Outer CRT Frame -->
  <rect width="1200" height="360" rx="10" fill="#060709" stroke="#22262c" stroke-width="2"/>
  <rect x="6" y="6" width="1188" height="348" rx="7" fill="#080a0d" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
  <rect x="6" y="6" width="1188" height="348" rx="7" fill="url(#grid)"/>

  <!-- Top Terminal Bar (Calm Monochrome) -->
  <rect x="6" y="6" width="1188" height="34" rx="6" fill="#0e1116"/>
  <line x1="6" y1="40" x2="1194" y2="40" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="26" cy="23" r="4.5" fill="#4a525d"/>
  <circle cx="42" cy="23" r="4.5" fill="#4a525d"/>
  <circle cx="58" cy="23" r="4.5" fill="#4a525d"/>
  <text x="80" y="27" class="mono" font-size="12.5" fill="#8b949e" letter-spacing="1.4">MICRO-KI+ // TERMINAL HUB — MAINZ, DE</text>
  <text x="1172" y="27" class="mono" font-size="12.5" fill="#8b949e" text-anchor="end" letter-spacing="1">PHP 8.5 · SYMFONY 7.4 · HOSTING: DE (ALL-INKL)</text>

  <!-- Centered Hero Title & Mission -->
  <g transform="translate(600, 92)">
    <text x="0" y="0" class="mono" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">MICRO KI+</text>
    <rect x="148" y="-31" width="9" height="30" fill="#ffffff" class="cursor"/>

    <text x="0" y="34" class="mono" font-size="17" font-weight="bold" fill="#e6edf3" text-anchor="middle" letter-spacing="1">Spezialisierte KI-Werkzeuge mit klarem Auftrag</text>
    <text x="0" y="60" class="mono" font-size="13.5" fill="#8b949e" text-anchor="middle" letter-spacing="0.4">Deterministische Prüfungen vor generativer KI — eine Spezialaufgabe, ein fester Ablauf, keine Abofallen.</text>
  </g>

  <!-- Symmetrical 3-Column Product Grid -->
  <!-- Card 1: Parser API KI+ -->
  <g transform="translate(32, 182)">
    <rect width="360" height="122" rx="6" fill="#0d1015" stroke="#262c34" stroke-width="1"/>
    <rect x="0" y="0" width="360" height="3" rx="1.5" fill="#00e8ff"/>
    <circle cx="20" cy="26" r="4" fill="#00e8ff"/>
    <text x="32" y="30" class="mono" font-size="15" font-weight="bold" fill="#ffffff" letter-spacing="1">PARSER API KI+</text>
    <text x="342" y="30" class="mono" font-size="11.5" fill="#00e8ff" text-anchor="end">parser-api.micro-ki.de</text>
    <line x1="16" y1="42" x2="344" y2="42" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="16" y="64" class="mono" font-size="12.5" fill="#c9d1d9">B2B-Dokumenten-Parser für n8n &amp; Make.</text>
    <text x="16" y="84" class="mono" font-size="12" fill="#8b949e">6 feste JSON-Schemas · XRechnung, ZUGFeRD,</text>
    <text x="16" y="102" class="mono" font-size="12" fill="#8b949e">camt &amp; MT940 (&lt; 2s) + Mistral EU OCR.</text>
  </g>

  <!-- Card 2: Bewerber Tool KI+ -->
  <g transform="translate(420, 182)">
    <rect width="360" height="122" rx="6" fill="#0d1015" stroke="#262c34" stroke-width="1"/>
    <rect x="0" y="0" width="360" height="3" rx="1.5" fill="#ffbf00"/>
    <circle cx="20" cy="26" r="4" fill="#ffbf00"/>
    <text x="32" y="30" class="mono" font-size="15" font-weight="bold" fill="#ffffff" letter-spacing="1">BEWERBER TOOL KI+</text>
    <text x="342" y="30" class="mono" font-size="11.5" fill="#ffbf00" text-anchor="end">bewerber-tool.micro-ki.de</text>
    <line x1="16" y1="42" x2="344" y2="42" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="16" y="64" class="mono" font-size="12.5" fill="#c9d1d9">Bewerbung in 4 Schritten mit Freigabe.</text>
    <text x="16" y="84" class="mono" font-size="12" fill="#8b949e">Anschreiben, Lebenslauf &amp; Mail mit Fakten-</text>
    <text x="16" y="102" class="mono" font-size="12" fill="#8b949e">regeln (Mistral EU) · Lesen 0 € / ZIP 2,99 €.</text>
  </g>

  <!-- Card 3: Fake Checker KI+ -->
  <g transform="translate(808, 182)">
    <rect width="360" height="122" rx="6" fill="#0d1015" stroke="#262c34" stroke-width="1"/>
    <rect x="0" y="0" width="360" height="3" rx="1.5" fill="#00ff41"/>
    <circle cx="20" cy="26" r="4" fill="#00ff41"/>
    <text x="32" y="30" class="mono" font-size="15" font-weight="bold" fill="#ffffff" letter-spacing="1">FAKE CHECKER KI+</text>
    <text x="342" y="30" class="mono" font-size="11.5" fill="#00ff41" text-anchor="end">fake-checker.micro-ki.de</text>
    <line x1="16" y1="42" x2="344" y2="42" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="16" y="64" class="mono" font-size="12.5" fill="#c9d1d9">Echtzeit-Prüfung gegen Fake-Shops &amp; Scams.</text>
    <text x="16" y="84" class="mono" font-size="12" fill="#8b949e">DNS, WHOIS, SSL, Handelsregister &amp; Warn-</text>
    <text x="16" y="102" class="mono" font-size="12" fill="#8b949e">listen vor KI · 100 % kostenlos + Lexikon.</text>
  </g>

  <!-- Subtle Bottom Status Footer -->
  <line x1="32" y1="322" x2="1168" y2="322" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="600" y="341" class="mono" font-size="12" fill="#6e7681" text-anchor="middle" letter-spacing="1.2">ARCHITEKTUR: [1. INPUT] ──► [2. DETERMINISTISCHER CODE] ──► [3. GEZIELTE KI-INFERENZ] ──► [4. VERIFIZIERTES ERGEBNIS]</text>

  <!-- Scanlines -->
  <rect x="6" y="6" width="1188" height="348" rx="7" fill="url(#scanlines)" pointer-events="none"/>
</svg>
